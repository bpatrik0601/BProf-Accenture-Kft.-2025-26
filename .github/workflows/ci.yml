name: UI Test Pipeline

on:
  push:
    branches: [ feature/add-ci-pipeline ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch: # Allows manual triggering for debugging or ad-hoc runs (via GitHub UI -> Actions tab -> "Run workflow" button)

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout the Maven (Playwright Java) repository
      # ---------------------------------------------------------
      - name: Checkout Maven Playwright repo
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Checkout the Angular frontend into a subfolder
      # ---------------------------------------------------------
      - name: Checkout Angular repo
        uses: actions/checkout@v4
        with:
          repository: bpatrik0601/BProf-Accenture-Kft.-2025-26--Angular-frontend
          path: angular-frontend
          token: ${{ secrets.ANGULAR_REPO_TOKEN }} # Access to private repo

      # ---------------------------------------------------------
      # 3. Node.js setup + caching for faster Angular builds
      # ---------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node.js modules
        uses: actions/cache@v3
        with:
          path: angular-frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('angular-frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Angular dependencies
        run: npm install --prefix angular-frontend

      # ---------------------------------------------------------
      # 4. Build the Angular application
      ## In CI, 'ng serve' is not reliable and may fail to serve assets/mock JSON files. 
      ## A production build is deterministic, stable, and always includes the mock data.
      # ---------------------------------------------------------
      - name: Build Angular
        run: npm run build --prefix angular-frontend

      # ---------------------------------------------------------
      # 5. Serve the built Angular app statically
      ## This guarantees that assets/mock/... JSON files are always available for Playwright tests. 
      ## Using a static server is significantly more stable and CI-friendly than 'ng serve'.
      # ---------------------------------------------------------
      - name: Serve Angular dist
        run: |
          npx http-server angular-frontend/dist/football-dashboard/browser -p 4200 --fallback index.html &
          npx wait-on http://localhost:4200
      
      # ---------------------------------------------------------
      # Debug: Verify Angular build output structure (Angular 17+).
      # This step helps confirm that the browser bundle and assets are generated in the expected location for CI serving.
      # ---------------------------------------------------------
      - name: Debug Angular build output (dist folder)
        run: |
          ls -R angular-frontend/dist/football-dashboard

      # ---------------------------------------------------------
      # 6. Java setup for Maven + Playwright tests
      # ---------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # ---------------------------------------------------------
      # 7. Run Playwright UI tests via Maven.
      # The tests now target the statically served Angular build
      # at http://localhost:4200, ensuring consistent DOM rendering
      # and reliable mock data loading.
      # ---------------------------------------------------------
      - name: Run Maven tests
        run: xvfb-run mvn test
        working-directory: ./demo

      # ---------------------------------------------------------
      # 8. Upload test reports (JUnit + Cucumber)
      # ---------------------------------------------------------
      - name: Upload JUnit test results
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: demo/target/surefire-reports/*.xml

      - name: Upload Cucumber report
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: demo/target/cucumber-report.html

      - name: Upload Cucumber JSON report
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-json
          path: demo/target/cucumber-report.json


  # =====================================================================
  # SECOND JOB: Static analysis (Java + Angular)
  # =====================================================================
  static-analysis:
    needs: ui-tests # Only run if UI tests succeed
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout Maven repo for static analysis
      # ---------------------------------------------------------
      - name: Checkout Maven repo
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Java setup for Checkstyle, SpotBugs, etc.
      # ---------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # ---------------------------------------------------------
      # 3. Run static analysis (Checkstyle, SpotBugs)
      # ---------------------------------------------------------
      - name: Run static analysis (Java)
        run: mvn -DskipTests=true verify
        working-directory: ./demo

      - name: Upload Checkstyle report
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: demo/target/checkstyle-result.xml

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: demo/target/spotbugs-result.xml

      # ---------------------------------------------------------
      # 4. Optimize imports (Revelc impsort plugin)
      # ---------------------------------------------------------
      - name: Optimize imports
        run: mvn impsort:sort
        working-directory: ./demo

      # ---------------------------------------------------------
      # 5. Angular linting (ESLint)
      # ---------------------------------------------------------
      - name: Checkout Angular repo
        uses: actions/checkout@v4
        with:
          repository: bpatrik0601/BProf-Accenture-Kft.-2025-26--Angular-frontend
          path: angular-frontend
          token: ${{ secrets.ANGULAR_REPO_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node.js modules
        uses: actions/cache@v3
        with:
          path: angular-frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('angular-frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Angular dependencies
        run: npm install --prefix angular-frontend

      - name: Run lint (Angular)
        run: npm run lint:ci --prefix angular-frontend -- --output-file=eslint-report.json --format=json

      - name: Upload ESLint report
        if: ${{ hashFiles('angular-frontend/eslint-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: angular-frontend/eslint-report.json
